name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint / Typecheck / Test
    # `ubuntu-latest` намеренно не закреплён конкретной версией, хотя с
    # 19 октября 2026 этот ярлык переезжает на Ubuntu 26. В прогоне нет ничего,
    # что зависит от версии системы: нет пакетов apt, нет браузеров (тесты —
    # vitest без сети), образ Chromium для воркера собирается своим
    # Dockerfile с собственной базой. Закрепление версии обменяло бы этот
    # риск на обязанность поднимать её вручную до снятия с поддержки.
    runs-on: ubuntu-latest
    steps:
      # Мажоры подняты до рантайма Node.js 24 (2026-10-03): на v4 все три
      # экшена заявляли Node.js 20, который GitHub уже не поддерживает и
      # принудительно подменял на Node.js 24 с предупреждением в каждом
      # прогоне. Подмена обещана не навсегда, поэтому это будущая поломка
      # сборки, а не косметика.
      - uses: actions/checkout@v7

      # pnpm перед setup-node: второму нужен установленный pnpm, чтобы найти
      # стор для `cache: pnpm`. Версия не указана намеренно — берётся из поля
      # `packageManager` корневого package.json (pnpm@9.15.9), тот же источник,
      # что у Dockerfile воркера. Переход на экшен-преемник `pnpm/setup`
      # невозможен: он требует pnpm v11 и новее.
      - uses: pnpm/action-setup@v6

      # `cache: pnpm` задан явно и работает по-прежнему. В v6 сузили только
      # автоматический кэш (`package-manager-cache`) — он теперь включается
      # сам лишь для npm, нашего явного значения это не касается.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # T-00: a build-breaking regression here was previously invisible to CI
      # (lint/typecheck/test all pass without ever running `next build`) —
      # it was only caught by a manual local build. Values below are
      # placeholders to satisfy apps/web/scripts/check-env.mjs so the build
      # can run; they are not real secrets and are never used at runtime.
      - name: Build web
        run: pnpm --filter geotrack-web build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
          SUPABASE_SERVICE_ROLE_KEY: ci
          ADMIN_SECRET: ci
          AUDIT_SERVICE_KEY: ci
          TURNSTILE_SECRET_KEY: ci
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci
          NEXT_PUBLIC_APP_URL: https://ci.example
          INNGEST_EVENT_KEY: ci
          FREE_DAILY_CEILING: '50'
          PADDLE_API_KEY: ci
          PADDLE_WEBHOOK_SECRET: ci
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ci
          PADDLE_PRICE_ID_STANDARD: ci
          PADDLE_PRICE_ID_EXTENDED: ci
          RESEND_API_KEY: ci
